name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install jprm==1.1.0

      - name: build
        id: build
        run: |
          mkdir -p artifacts
          zip=$(jprm plugin build . --output artifacts --version "${GITHUB_REF_NAME#v}.0" --dotnet-framework net9.0)
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" --title "$GITHUB_REF_NAME" --generate-notes

      # The manifest Jellyfin reads lives on the gh-pages branch, served by GitHub Pages.
      - name: add it to the plugin repository
        env:
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages
            git worktree add repo gh-pages
          else
            git worktree add --orphan -b gh-pages repo
          fi
          [ -f repo/manifest.json ] || jprm repo init repo
          jprm repo add --plugin-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$(basename "$ZIP")" repo "$ZIP"
          cd repo
          git add manifest.json
          git commit -m "add $GITHUB_REF_NAME"
          git push origin gh-pages
